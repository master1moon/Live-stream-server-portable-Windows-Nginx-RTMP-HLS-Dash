worker_processes  1;
# 'worker_rlimit_nofile' هو حد أقصى لعدد الملفات التي يمكن لكل عملية فتحها.
# رفع هذا الرقم يحسن الأداء عند وجود اتصالات كثيرة.
worker_rlimit_nofile 65535;

error_log  logs/error.log;

events {
    # 'use epoll;' هي طريقة فعالة للتعامل مع الاتصالات في نظام لينكس.
    use epoll;
    worker_connections  1024;
    # 'multi_accept on;' تسمح للعملية بقبول عدة اتصالات جديدة مرة واحدة.
    multi_accept on;
}

http {
    # إعدادات المهلات (timeouts) للشبكات البطيئة.
    keepalive_timeout	30;
    send_timeout        10;
    keepalive_requests  10;
    client_body_timeout 10;

    # gzip مفعل لضغط الملفات النصية (HTML, CSS, JS) لتقليل حجم البيانات المرسلة.
    gzip		on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
    sendfile		on;
    include		mime.types;
    default_type	application/octet-stream;

    log_format	main  '$remote_addr - $remote_user [$time_local] "$request" '
	                  '$status $body_bytes_sent "$http_referer" '
	                  '"$http_user_agent" "$http_x_forwarded_for"';
    access_log	logs/access.log  main;

    # تعريف الخادم الذي سيستمع على المنفذ 8090.
    server {
        listen 8090;
        server_name localhost;
        access_log logs/host.access.log main;

        # موقع الصفحة الرئيسية.
        location / {
            root site;
            # إضافة رأس للسماح بطلبات CORS من أي نطاق.
            add_header 'Access-Control-Allow-Origin' '*';
            try_files $uri $uri/ /offline.html =404;
        }

        # موقع ملفات HLS المؤقتة.
        location /tmp_hls {
            alias temp/tmp_hls;
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            # رفع الحد الأقصى لحجم ذاكرة التخزين المؤقت للعميل لتجنب تقطيع الفيديو.
            client_max_body_size 20M;
            add_header Cache-Control no-cache;
            add_header 'Access-Control-Allow-Origin' '*';
        }

        # موقع ملفات DASH المؤقتة.
        location /tmp_dash {
            alias temp/tmp_dash;
            types {
                application/dash+xml mpd;
                video/mp4 m4s;
            }
            add_header Cache-Control no-cache;
            add_header 'Access-Control-Allow-Origin' '*';
        }

        # موقع صفحة الإحصائيات.
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
            # تقييد الوصول إلى صفحة الإحصائيات للمستخدمين المصرح لهم فقط.
            auth_basic "Restricted Content";
            auth_basic_user_file .htpasswd;
        }

        location /stat.xsl {
            root site;
        }
    }
}

rtmp {
    server {
        listen 1935;
        # حجم القطع (chunk) مهم للشبكات البطيئة. قيمة 4096 هي جيدة.
        chunk_size 4096;

        application live {
            live on;
            interleave on;
            meta on;
            max_connections 1500;
            record_path recordings;
            record_suffix all-%d-%b-%y-%T.flv;
            # دفع البث الوارد إلى تطبيق HLS.
            push rtmp://localhost/hls;
            # دفع البث الوارد إلى تطبيق DASH.
            push rtmp://localhost/dash;
        }

        application hls {
            live on;
            hls on;
            hls_nested on;
            hls_cleanup on;
            meta copy;
            hls_type live;
            # طول القطعة (fragment) 5 ثوانٍ هو مثالي للبث المباشر.
            hls_fragment 5s;
            # طول قائمة التشغيل (playlist) 30 ثانية.
            hls_playlist_length 30s;
            hls_path temp/tmp_hls;
            hls_fragment_naming system;

            # تعريف الجودات المختلفة (Adaptive Bitrate).
            # سيتم إعادة ترميز البث إلى هذه الجودات.
            exec_push /usr/local/bin/ffmpeg -i rtmp://localhost/live/$name -c:a aac -b:a 128k -c:v libx264 -b:v 2048k -vf "scale=1280:720" -f flv rtmp://localhost/hls/$name_high -c:v libx264 -b:v 1024k -vf "scale=854:480" -f flv rtmp://localhost/hls/$name_mid -c:v libx264 -b:v 512k -vf "scale=640:360" -f flv rtmp://localhost/hls/$name_low;
            # تعريف هذه الجودات في قائمة التشغيل الرئيسية.
            hls_variant _low BANDWIDTH=512000;
            hls_variant _mid BANDWIDTH=1024000;
            hls_variant _high BANDWIDTH=2048000;
        }

        application dash {
            live on;
            dash on;
            dash_nested on;
            dash_cleanup on;
            dash_fragment 5s;
            dash_playlist_length 30s;
            dash_path temp/tmp_dash;
        }
    }
}
